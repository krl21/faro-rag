# Plantilla procesada por envsubst al arrancar la imagen oficial de nginx.
# Variables disponibles: ${NGINX_MAX_BODY_MB}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Algo MAYOR que MAX_UPLOAD_MB de la API (el multipart añade overhead):
    # así es la API, y no nginx, quien rechaza el fichero con un error JSON
    # que la UI puede mostrar, en vez de un 413 en HTML.
    client_max_body_size ${NGINX_MAX_BODY_MB}m;

    # --- Proxy al backend: /api/documents -> http://api:8000/documents ------
    # Con `proxy_pass http://api:8000/` nginx resuelve `api` una sola vez al
    # arrancar: si el contenedor de la API se recrea y cambia de IP, todas las
    # peticiones dan 502. Con el DNS de Docker y una variable se resuelve en
    # cada petición (caché de 10 s). Con variable, la URI no se reescribe sola:
    # lo hace el rewrite.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # /ask puede esperar al LLM: por encima de LLM_TIMEOUT_S
        proxy_read_timeout 60s;
        # nginx reenvía por defecto las cabeceras traceparent/tracestate,
        # así que si el frontend se instrumenta, la traza continúa en la API.
    }

    # --- Assets con hash: caché larga ----------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA: cualquier ruta del router de React devuelve index.html ---------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Cabeceras básicas de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}