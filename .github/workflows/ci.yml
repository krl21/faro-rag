# CI: lint + tests de backend y frontend.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend: same `tests` service as `make test` (test image, PostgreSQL with
  # pgvector and the faro_test database, Redis, fake LLM and embeddings).
  backend:
    name: Backend (lint, format, unit and integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image
        run: docker compose --profile test build tests
      # The checkout is mounted into the container and belongs to another user:
      # no ruff or pytest cache is written there.
      - name: Lint and format (ruff)
        run: docker compose --profile test run --rm tests sh -c "ruff check --no-cache . && ruff format --check --no-cache ."
      - name: Tests (pytest)
        run: docker compose --profile test run --rm tests pytest -q -p no:cacheprovider
      - name: Stop the services
        if: always()
        run: docker compose --profile test down -v

  frontend:
    name: Frontend (types, lint, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
